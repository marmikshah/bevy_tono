# Manually dispatched release: Actions → Release → Run workflow on master.
# The version comes from Cargo.toml and the notes from its CHANGELOG.md
# section; nothing is tagged by hand. Preflight refuses anything that is not
# the live master with a dated changelog entry and an unpublished version, the
# gate reruns CI on that exact commit, and only then does the `production` job
# publish to crates.io (CRATES_API_TOKEN) and create the tag + GitHub Release.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  UA: "bevy_tono-release (https://github.com/marmikshah/bevy_tono)"

jobs:
  preflight:
    name: Verify release identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Verify release identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          [ "$GITHUB_REF" = refs/heads/master ] || fail "dispatch the release from master (got $GITHUB_REF)"
          COMMIT="$(git rev-parse HEAD)"
          LIVE="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)"
          [ "$COMMIT" = "$LIVE" ] || fail "master moved to $LIVE after the dispatch of $COMMIT; dispatch again"

          VERSION="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "bevy_tono") | .version')"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "not a release version: '$VERSION'"
          TAG="v$VERSION"

          # A [patch] builds against code crates.io users cannot get, and
          # cargo publish ignores it, so the crate would ship untested.
          if grep -q '^\[patch' Cargo.toml; then fail "Cargo.toml still has a [patch] section"; fi

          HEADING="$(grep -m1 -F "## $VERSION — " CHANGELOG.md || true)"
          [ -n "$HEADING" ] || fail "CHANGELOG.md has no '## $VERSION — <date>' section"
          [[ "$HEADING" =~ —\ [0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || fail "date the changelog heading: $HEADING"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            fail "tag $TAG already exists; bump the version"
          fi
          CODE="$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" "https://crates.io/api/v1/crates/bevy_tono/$VERSION")"
          [ "$CODE" = 404 ] || fail "crates.io answered HTTP $CODE for bevy_tono $VERSION (want 404: unpublished)"

          {
            echo "commit=$COMMIT"
            echo "tag=$TAG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          # Literal Markdown backticks belong in the summary format string.
          # shellcheck disable=SC2016
          printf '## Release preflight\n\n- Version: `%s`\n- Tag: `%s`\n- Commit: `%s`\n' \
            "$VERSION" "$TAG" "$COMMIT" >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: CI
    needs: preflight
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ needs.preflight.outputs.tag }}
    needs: [preflight, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
    env:
      COMMIT: ${{ needs.preflight.outputs.commit }}
      TAG: ${{ needs.preflight.outputs.tag }}
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - name: Install Linux build deps for Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Each step skips what is already done, so "Re-run failed jobs" after a
      # later failure picks up where the run stopped.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_API_TOKEN }}
        run: |
          set -euo pipefail
          CODE="$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" "https://crates.io/api/v1/crates/bevy_tono/$VERSION")"
          if [ "$CODE" = 200 ]; then
            echo "bevy_tono $VERSION is already on crates.io; skipping"
          else
            cargo publish
          fi
      - name: Tag and create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # This version's changelog section, without its heading.
          awk -v v="$VERSION" '
            index($0, "## " v " — ") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "::error::empty release notes"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$COMMIT" \
              --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          echo "Published [bevy_tono $VERSION](https://crates.io/crates/bevy_tono/$VERSION) as $TAG." >> "$GITHUB_STEP_SUMMARY"
